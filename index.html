<!DOCTYPE html> <!--Tag de documento padrão-->
<html lang="en"><!--Tag da linguagem-->
<head><!--Início da tag de cabeçalho-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Tag de configuração de visualização-->
    <link rel="stylesheet" type="text/css" href="estilo.css"><!--Tag de link para o arquivo CSS externo-->
    <title>Meu Portal de Entretenimento Digital</title><!--Tag de título da página-->
</head><!--Fim da tag de cabeçalho-->
<!--Comentário: O corpo da página começa aqui-->

<div class="principal"><!--Início da div principal-->

        <img src="Westworld.jpg"><!--Tag de imagem com fonte especificada-->
    </div><!--Fim da primeira coluna-->
    <div class="coluna2"><!--Início da segunda coluna-->
        <h2>Podcasts</h2><!--Tag de título secundário-->
        <img src="DevShow.jpg"><!--Tag de imagem com fonte especificada-->
        <img src="falaDev-Podcast.jpg"><!--Tag de imagem com fonte especificada-->
        <img src="HipstersTech.png"><!--Tag de imagem com fonte especificada-->
    </div><!--Fim da segunda coluna-->
    <div class ="coluna3"><!--Início da terceira coluna-->
        <h2>Livros</h2><!--Tag de título secundário-->

        <img src="FORBELLONE & ELBERSPACHER - Lógica de Programação..jpg"><!--Tag de imagem com fonte especificada-->

</div><!--Fim da div principal-->
</body><!--Fim da tag de corpo-->
</html><!--Fim do documento HTML-->
